[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eda_predict_future_sales"
version = "0.0.1"
description = "Exploratory data analysis for the Kaggle Predict Future Sales competition."
authors = [
  { name = "Ericklies" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["eda_predict_future_sales"]
include = ["pyproject.toml", "eda_predict_future_sales/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["eda_predict_future_sales"]
force-sort-within-sections = true

